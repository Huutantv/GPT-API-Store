services:
  doro-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doro-proxy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DORO_PUBLIC_IP=${DORO_PUBLIC_IP:-}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - DORO_DB_PATH=${DORO_DB_PATH:-/app/data/credit.db}
    volumes:
      - ./.env:/app/.env
      - proxy-data:/app/data
    ports:
      - "${DORO_PROXY_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');http.get('http://127.0.0.1:4000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  proxy-data:
